# Shared credential-marked SETTINGS for all omp channels (shared-auth 2026-09-19).
# Loaded by every channel wrapper as the second PI_CONFIG_FILES overlay, i.e. ABOVE the
# profile and project layers: a key set here is the effective value in omp, ompd and ompdev.
# This is the single update path for credential-marked settings that are not provider
# logins (those live in the credential authority): edit this file, not /settings.
#
# Keys this file is meant for (credential-marked in settings-schema.ts):
#   hindsight.apiToken, mnemopi.llmApiKey, mnemopi.embeddingApiKey,
#   searxng.token, searxng.basicUsername, searxng.basicPassword,
#   dev.autoqaPush.token, images.urls.credentials (record)
# Env vars from ~/.zshenv (EXA_API_KEY, TYPESAFE_API_KEY, ...) are already machine-wide and
# need no entry here. Keep this file 0600; it is deliberately NOT immutable.
#
# Example:
# hindsight:
#   apiToken: "..."
