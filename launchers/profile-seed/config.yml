# Seeded 2026-09-19 by the launcher-isolation wave from the approved nonsecret
# overlay /Users/farhad/.omp/implementation-2026-09-18/models.yml (model roles +
# 45% auto-compaction). No credentials are seeded: log in per channel.
modelRoles:
  default: anthropic/claude-fable-5-1
  slow: anthropic/claude-fable-5-1
  plan: anthropic/claude-fable-5-1
  smol: openai-codex/gpt-5.6-sol
  task: anthropic/claude-fable-5-1
  reviewer: openai-codex/gpt-5.6-sol
compaction:
  enabled: true
  thresholdPercent: 45
  thresholdTokens: -1
  midTurnEnabled: true
  autoContinue: true
# Subscription-only model policy (approved defaults: Fable via Anthropic OAuth, Sol via
# openai-codex OAuth). Every other catalog provider and the keyless local discoverables are
# disabled so an API key inherited from the shell environment (e.g. FIREWORKS_API_KEY from
# ~/.zshenv) can never become the silently selected default. With no login yet, no model
# resolves and the TUI shows the pending-login state instead of a paid fallback.
