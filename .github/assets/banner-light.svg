<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="ompd — the daily fork of oh-my-pi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="318" rx="23" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">
    <text x="96" y="196" font-size="148" fill="#1f2328">omp<tspan fill="url(#d)">d</tspan></text>
  </g>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="102" y="250" font-size="30" fill="#59636e">the daily fork of <tspan fill="#1f2328">oh-my-pi</tspan></text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <rect x="700" y="92" width="500" height="136" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
    <text x="728" y="138" fill="#59636e">$ <tspan fill="#1f2328">omp</tspan>  <tspan fill="#818b98"># upstream release</tspan></text>
    <text x="728" y="188" fill="#59636e">$ <tspan fill="#0891b2">ompd</tspan> <tspan fill="#818b98"># upstream + fork stack</tspan></text>
  </g>
</svg>
